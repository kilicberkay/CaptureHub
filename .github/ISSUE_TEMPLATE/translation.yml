name: Translation
description: A wrong, awkward, or missing translation
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: Deutsch (de)
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Current text and suggested text
      description: Where you saw it (popup, editor, settings) helps us find the key.
    validations:
      required: true
